{
  "device.node_id": "fin-core-gateway01",
  "ftp.enabled": true,
  "ftp.port": 21,
  "http.enabled": true,
  "http.port": 8088,
  "http.skin": "nasLogin",
  "httpproxy.enabled": false,
  "mysql.enabled": true,
  "mysql.port": 3306,
  "redis.enabled": true,
  "redis.port": 6379,
  "rdp.enabled": true,
  "rdp.port": 3389,
  "smb.auditfile": "/var/log/samba-audit.log",
  "smb.enabled": false,
  "ssh.enabled": false,
  "portscan.enabled": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {"format": "%(message)s"}
      },
      "handlers": {
        "file": {
          "class": "logging.handlers.RotatingFileHandler",
          "filename": "/var/tmp/opencanary/opencanary.log",
          "formatter": "plain",
          "maxBytes": 10485760,
          "backupCount": 5
        }
      }
    }
  }
}

